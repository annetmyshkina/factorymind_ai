services:
  db:
    image: postgres:17
    container_name: factorymind-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: factorymind
      POSTGRES_USER: factorymind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factorymind -d factorymind"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: factorymind-mosquitto
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_pub -h 127.0.0.1 -p 1883 -t healthcheck -m ok",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  simulator:
    build:
      context: .
      dockerfile: Dockerfile.simulator
    container_name: factorymind-simulator
    profiles: ["simulation"]
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_TELEMETRY_TOPIC: ${MQTT_TELEMETRY_TOPIC:-factorymind/equipment/+/telemetry}
      SIMULATOR_EQUIPMENT_CODES: ${SIMULATOR_EQUIPMENT_CODES:-CMP-01,CMP-02,CMP-03}
      SIMULATOR_SCENARIO: ${SIMULATOR_SCENARIO:-demo_cycle}
      SIMULATOR_INTERVAL_SECONDS: ${SIMULATOR_INTERVAL_SECONDS:-2}
      SIMULATOR_STEPS: ${SIMULATOR_STEPS:-0}
      SIMULATOR_SEED: ${SIMULATOR_SEED:-42}
      SIMULATOR_DROP_RATE: ${SIMULATOR_DROP_RATE:-0}
      SIMULATOR_DUPLICATE_RATE: ${SIMULATOR_DUPLICATE_RATE:-0}
      SIMULATOR_DELAY_RATE: ${SIMULATOR_DELAY_RATE:-0}
      SIMULATOR_DELAY_STEPS: ${SIMULATOR_DELAY_STEPS:-2}

  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: factorymind-prometheus
    profiles: ["observability"]
    restart: unless-stopped
    network_mode: host
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.listen-address=127.0.0.1:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:13.3.1
    container_name: factorymind-grafana
    profiles: ["observability"]
    restart: unless-stopped
    network_mode: host
    depends_on:
      - prometheus
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
  prometheus_data:
  grafana_data:
