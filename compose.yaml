services:
  db:
    image: postgres:17
    container_name: factorymind-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: factorymind
      POSTGRES_USER: factorymind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factorymind -d factorymind"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: factorymind-mosquitto
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_pub -h 127.0.0.1 -p 1883 -t healthcheck -m ok",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log: