[project]
name = "factorymind-ai"
version = "0.1.0"
description = "Industrial equipment monitoring and AI experimentation platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "concurrent-log-handler>=0.9.31",
    "fastapi",
    "paho-mqtt>=2.1.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings",
    "sqlalchemy>=2.1.5",
    "structlog>=26.1.0",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest",
    "pytest-cov>=7.1.0",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B",]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
